<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proyecto · La Classe dels Grans</title>

<style>
:root{
  --navy:#10233f;
  --orange:#f4a51c;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--navy);
  background:linear-gradient(#efe4ff 0,#fff0f7 50%,#fffdf8 100%);
  min-height:100vh;
}

.hero{
  padding:45px 20px 25px;
  text-align:center;
}

.back{
  display:inline-block;
  margin-bottom:28px;
  padding:10px 18px;
  border-radius:999px;
  background:#ffffffcc;
  color:var(--navy);
  text-decoration:none;
  font-weight:700;
  box-shadow:0 5px 15px #17304b18;
}

.back:hover{
  transform:translateY(-2px);
}

.big-icon{
  font-size:4.5rem;
  display:block;
  margin-bottom:10px;
}

h1{
  font-size:clamp(2.7rem,7vw,5.5rem);
  line-height:1;
  margin:0;
  font-weight:900;
  letter-spacing:-.045em;
}

.underline{
  width:min(280px,50vw);
  height:8px;
  background:var(--orange);
  border-radius:999px;
  margin:20px auto;
  transform:rotate(-1deg);
}

.intro{
  max-width:650px;
  margin:0 auto;
  color:#536278;
  font-size:1.05rem;
  line-height:1.6;
}

.cards{
  max-width:700px;
  margin:35px auto 70px;
  padding:0 22px;
}

.card{
  position:relative;
  display:flex;
  min-height:300px;
  padding:30px;
  border-radius:28px;
  text-decoration:none;
  color:inherit;
  overflow:hidden;
  box-shadow:0 16px 40px #17304b1a;
  border:2px solid #fff;
  transition:.22s ease;
  flex-direction:column;
  justify-content:flex-end;
  background:linear-gradient(145deg,#eee0ff,#fff2dc);
}

.card:hover{
  transform:translateY(-7px);
  box-shadow:0 22px 48px #17304b2c;
}

.icon{
  position:absolute;
  top:30px;
  left:30px;
  font-size:5rem;
  filter:drop-shadow(0 5px 4px #00000012);
}

.card h2{
  font-size:clamp(1.65rem,3vw,2.3rem);
  margin:0 0 8px;
  padding-right:40px;
  line-height:1.15;
}

.card p{
  margin:0;
  color:#536278;
  font-size:1rem;
  line-height:1.45;
  padding-right:45px;
}

.arrow{
  position:absolute;
  right:24px;
  bottom:24px;
  width:48px;
  height:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--navy);
  color:white;
  font-size:1.6rem;
}

footer{
  text-align:center;
  padding:20px 20px 35px;
  color:#718096;
  font-size:.8rem;
}

@media(max-width:700px){
  .card{
    min-height:250px;
  }
}
</style>
</head>

<body>

<header class="hero">

  <a class="back" href="../index.html">
    ← La Classe dels Grans
  </a>

  <span class="big-icon">🔬</span>

  <h1>PROYECTO</h1>

  <div class="underline"></div>

  <p class="intro">
    Investigamos, descubrimos y buscamos respuestas a nuestras preguntas.
  </p>

</header>


<main class="cards">

  <a class="card" href="../minerales/index.html">

    <div class="icon">💎</div>

    <h2>¿De dónde salen tantos tipos de minerales?</h2>

    <p>
      Descubre cómo se forman los minerales y por qué existe tanta variedad.
    </p>

    <div class="arrow">›</div>

  </a>

</main>


<footer>
  La Classe dels Grans · Escola Sant Isidre
</footer>

</body>
</html>
